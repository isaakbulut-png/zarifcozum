    // --- Main Application Component ---
    function TeacherProfileSettingsApp() {
      const [activeTab, setActiveTab] = useState('general');
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      // 2. Kimlik & Belgeler State

      // 3. Ödeme & Fatura State

        billingAddress: 'Fenerbahçe Mah. Bağdat Cad. No:142 D:8 Kadıköy / İstanbul'
      });

      // 4. Ders & Entegrasyon State
      const [integration, setIntegration] = useState({
        timeZone: 'Europe/Istanbul',
        zoomConnected: true,
        zoomEmail: 'ahmet.yilmaz@egitim.com',
        meetConnected: false,
        isOpenForNewStudents: true,
        maxWeeklyHours: 25
      });

      // 5. Güvenlik & Bildirimler State
      const [security, setSecurity] = useState({
        currentPassword: '',
        newPassword: '',
        confirmPassword: '',
        showPassword: false,
        twoFactorAuth: true,
        notifications: {
          emailNewMessage: true,
          smsLessonReminder: true,
          emailHomeworkSubmitted: true,
          systemAnnouncements: true
        }
      });

      // Mesajlar (Öğrenci & Veli Mesaj Havuzu) Mock Verisi
      const [conversations, setConversations] = useState([
        {
          id: 1,
          name: 'Zeynep Kaya',
          role: 'Öğrenci (11. Sınıf)',
          roleType: 'student',
          avatar: 'Z',
          avatarBg: 'bg-emerald-500',
          unread: true,
          time: '14:22',
          messages: [
            { id: 1, sender: 'student', text: 'Hocam merhaba, dün paylaştığınız trigonometri kazanım testindeki 4. sorunun çözüm adımında takıldım.', time: '14:20' },
            { id: 2, sender: 'student', text: 'Yarınki canlı dersimizde bu soruya birkaç dakika ayırabilir miyiz?', time: '14:22' }
          ]
        },
        {
          id: 2,
          name: 'Murat Demir',
          role: 'Veli (Ali Demir - 9. Sınıf)',
          roleType: 'parent',
          avatar: 'M',
          avatarBg: 'bg-amber-600',
          unread: false,
          time: '11:05',
          messages: [
            { id: 1, sender: 'parent', text: 'Ahmet Bey iyi günler, Ali\'nin son deneme sınavındaki geometri netleri yükselmiş. İlginiz için çok teşekkür ederiz.', time: '11:00' },
            { id: 2, sender: 'teacher', text: 'Rica ederim Murat Bey, Ali derste çok odaklı çalışıyor. Haftalık ödevlerini de aksatmadan bitiriyor.', time: '11:05' }
          ]
        },
        {
          id: 3,
          name: 'Burak Aydın',
          role: 'Öğrenci (8. Sınıf LGS)',
          roleType: 'student',
          avatar: 'B',
          avatarBg: 'bg-blue-500',
          unread: false,
          time: 'Dün',
          messages: [
            { id: 1, sender: 'student', text: 'Hocam LGS deneme sınavı analiz raporu sisteme yüklendi mi?', time: 'Dün 17:40' },
            { id: 2, sender: 'teacher', text: 'Evet Burak, başarı analizi sekmesinden karnene ulaşabilirsin.', time: 'Dün 17:55' }
          ]

      // Öğretmen Hakediş ve Ödeme Geçmişi State (Kural 4)
      const [payouts, setPayouts] = useState([
        {
          id: 'mock-1',
          period: '2026-11',
          periodLabel: 'Kasım 2026',
          grossAmount: 18500,
          withholdingRate: 20,
          withholdingAmount: 3700,
          netAmount: 14800,
          taxType: 'bireysel',
          bankName: 'Ziraat Bankası',
          iban: 'TR42 0001 0012 3456 7890 1234 56',
          status: 'odendi',
          receiptUrl: '/uploads/payout-receipts/ornek-dekont.pdf',
          paidAt: '2026-11-20T10:30:00Z',
          description: 'Kasım 2026 Ders Hakedişi (28 Saat Canlı Ders + Soru Primi)',
          invoiceStatus: 'muaf'
        },
        {
          id: 'mock-2',
          period: '2026-10',
          periodLabel: 'Ekim 2026',
          grossAmount: 16200,
          withholdingRate: 20,
          withholdingAmount: 3240,

          taxType: 'bireysel',
          bankName: 'Ziraat Bankası',
          iban: 'TR42 0001 0012 3456 7890 1234 56',
          status: 'odendi',
          receiptUrl: '/uploads/payout-receipts/ornek-dekont.pdf',
          paidAt: '2026-10-22T14:15:00Z',
          description: 'Ekim 2026 Ders Hakedişi (24 Saat Canlı Ders + Soru Primi)',
          invoiceStatus: 'muaf'
        }
      ]);

      const [notifications, setNotifications] = useState([]);
      const [showNotificationsModal, setShowNotificationsModal] = useState(false);

      useEffect(() => {
        // URL query param tab
        const urlParams = new URLSearchParams(window.location.search);
        const tab = urlParams.get('tab');
        if (tab && ['general', 'identity', 'billing', 'integration', 'security', 'support'].includes(tab)) {
          setActiveTab(tab);
        }

        // Hakedişleri API'den al
        fetch('/api/ogretmen/hakedisler')
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data && data.payouts && data.payouts.length > 0) {
              setPayouts(data.payouts);
            }
          })
          .catch(() => {});

        // Bildirimleri API'den al
        fetch('/api/ogretmen/bildirimler')
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data && data.notifications) {
              setNotifications(data.notifications);
            }
          })
          .catch(() => {});

        // Profil ayarlarını API'den al
        fetch('/api/ogretmen/profil-ayarlari')
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data && data.user) {
              const u = data.user;
              if (u.name) {
                const parts = u.name.split(' ');
                setGeneral(g => ({ ...g, firstName: parts[0] || g.firstName, lastName: parts.slice(1).join(' ') || g.lastName, email: u.email || g.email, phone: u.phone || g.phone }));
              }
              if (u.teacherFinance) {
                const tf = u.teacherFinance;
                setBilling(b => ({
                  ...b,
                  bankName: tf.bankName || b.bankName,
                  iban: tf.iban || b.iban,
                  accountHolder: tf.accountHolder || b.accountHolder,
                  taxType: tf.taxType === 'sahis_sirketi' || tf.taxType === 'limited_sirket' ? 'company' : 'individual',
                  taxOffice: tf.taxOffice || b.taxOffice,
                  taxNumber: tf.taxNumber || b.taxNumber,
                  billingAddress: tf.billingAddress || b.billingAddress
                }));
              }
            }
          })
          .catch(() => {});
      }, []);

      // Fatura Yükleme Fonksiyonu (Şirket Öğretmenleri İçin - Kural 1)
      const handleUploadInvoiceFile = async (payoutId, file) => {
        if (!file) return;
        const formData = new FormData();
        formData.append('invoice', file);
        formData.append('payoutId', payoutId);

        try {
          const res = await fetch('/api/ogretmen/fatura-yukle', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.mesaj || 'Fatura yüklenemedi');
          showToast('e-Faturanız muhasebeye iletildi.');
          // Listeyi yenile
          const ref = await fetch('/api/ogretmen/hakedisler');
          if (ref.ok) {
            const refData = await ref.json();
            if (refData.payouts) setPayouts(refData.payouts);
          }
        } catch (e) {
          showToast('Fatura yüklenemedi: ' + e.message, 'error');
        }
      };

      // Toast Gösterim Yardımcısı
      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => {
          setToast({ show: false, message: '', type: 'success' });
        }, 3200);
      };

      // Değişiklikleri Kaydet
      const handleSave = async (tabName) => {
        try {
          if (activeTab === 'billing') {
            await fetch('/api/ogretmen/profil-ayarlari', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                bankName: billing.bankName,
                iban: billing.iban,
                accountHolder: billing.accountHolder,
                taxType: billing.taxType === 'company' ? 'sahis_sirketi' : 'bireysel',
                taxOffice: billing.taxOffice,
                taxNumber: billing.taxNumber,
                billingAddress: billing.billingAddress
              })
            });
          }
          showToast(`${tabName} başarıyla güncellendi ve kaydedildi.`);
        } catch (e) {
          showToast(`${tabName} kaydedildi.`);
        }
      };

      // Branş Etiketi Ekleme
      const handleAddBranch = () => {
        if (!general.newBranchInput.trim()) return;
        if (!general.branches.includes(general.newBranchInput.trim())) {
          setGeneral(prev => ({
            ...prev,
            branches: [...prev.branches, prev.newBranchInput.trim()],
            newBranchInput: '',
            showNewBranchInput: false
          }));
          showToast(`"${general.newBranchInput.trim()}" branşı eklendi.`);
        }
      };

      // Branş Etiketi Çıkarma
      const handleRemoveBranch = (branchToRemove) => {
        setGeneral(prev => ({
          ...prev,
          branches: prev.branches.filter(b => b !== branchToRemove)
        }));
      };

      // Fotoğraf Yükleme Önizleme
      const handlePhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setGeneral(prev => ({ ...prev, photo: reader.result }));
            showToast('Profil fotoğrafı güncellendi.');
          };
          reader.readAsDataURL(file);
        }
      };

      // Belge Yükleme Mock Simülasyonu
      const handleDocumentUpload = (docKey) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.pdf,.png,.jpg,.jpeg';
        input.onchange = (e) => {
          const file = e.target.files?.[0];
          if (file) {
            setVerification(prev => ({
              ...prev,
              documents: {
                ...prev.documents,
                [docKey]: {
                  name: file.name,
                  status: 'pending',
                  date: new Date().toLocaleDateString('tr-TR')
                }
              }
            }));
            showToast(`${file.name} başarıyla yüklendi. İnceleniyor.`);
          }
        };
        input.click();
      };

      // Mesaj Yanıtlama
      const handleSendMessage = () => {
        if (!replyText.trim()) return;
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setConversations(prev => prev.map(chat => {
          if (chat.id === selectedChatId) {
            return {
              ...chat,
              messages: [...chat.messages, { id: Date.now(), sender: 'teacher', text: replyText.trim(), time: now }]
            };
          }
          return chat;
        }));
        setReplyText('');
        showToast('Cevabınız öğrenci/veliye iletildi.');
      };

      const currentChat = conversations.find(c => c.id === selectedChatId) || conversations[0];

      return (
        <div className="min-h-screen flex flex-col bg-[#f6f8fb]">
          
          {/* --- TOPBAR HEADER (Görseldeki Header ile Birebir) --- */}
          <header className="sticky top-0 z-30 bg-white border-b border-slate-200/80 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              
              {/* Sol: Logo */}
              <div className="flex items-center gap-3">
                <a href="/ogretmen-paneli.html" className="flex items-center gap-2.5 text-indigo-600 font-bold text-lg tracking-tight hover:opacity-90 transition">
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <Icon name="BookOpen" className="w-5 h-5 text-white" />
                  </div>
                  <div className="flex flex-col leading-tight">
                    <span className="text-slate-900 font-extrabold text-base">ZarifÇözüm</span>
                    <span className="text-xs font-semibold text-indigo-600">Eğitim Platformu</span>

                            <label className="block text-xs font-bold text-slate-700 mb-1.5">Mevcut Şifre</label>
                            <input
                              type={security.showPassword ? 'text' : 'password'}
                              value={security.currentPassword}
                              onChange={(e) => setSecurity({ ...security, currentPassword: e.target.value })}
                              placeholder="••••••••"
                              className="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-800"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1.5">Yeni Şifre</label>
                            <input
                              type={security.showPassword ? 'text' : 'password'}
                              value={security.newPassword}
                              onChange={(e) => setSecurity({ ...security, newPassword: e.target.value })}
                              placeholder="En az 8 karakter"
                              className="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-800"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1.5">Yeni Şifre Tekrar</label>
                            <input
                              type={security.showPassword ? 'text' : 'password'}
                              value={security.confirmPassword}
                              onChange={(e) => setSecurity({ ...security, confirmPassword: e.target.value })}
                              placeholder="••••••••"
                              className="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-800"
                            />
                          </div>
                        </div>

                        <div className="flex items-center justify-between text-xs text-slate-500">
                          <label className="inline-flex items-center gap-2 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={security.showPassword}
                              onChange={(e) => setSecurity({ ...security, showPassword: e.target.checked })}
                              className="rounded text-indigo-600 focus:ring-0"
                            />
                            Şifreleri göster
                          </label>
                          <span className="text-[11px] text-slate-400">Büyük harf, küçük harf ve rakam içermelidir.</span>
                        </div>
                      </div>

                      {/* İki Faktörlü Doğrulama (2FA) */}
                      <div className="bg-slate-50/80 p-5 rounded-xl border border-slate-200/80 flex items-center justify-between gap-4">
                        <div>
                          <h4 className="text-sm font-bold text-slate-900">İki Faktörlü Doğrulama (2FA)</h4>
                          <p className="text-xs text-slate-500 mt-0.5">
                            Giriş yaparken SMS veya Authenticator uygulaması ile ek güvenlik kodu sorulur.
                          </p>
                        </div>
                        <label className="relative inline-flex items-center cursor-pointer shrink-0">
                          <input
                            type="checkbox"
                            checked={security.twoFactorAuth}
                            onChange={(e) => setSecurity({ ...security, twoFactorAuth: e.target.checked })}
                            className="sr-only peer"
                          />
                          <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                        </label>
                      </div>

                      {/* Bildirim Tercihleri Checkbox Listesi */}
                      <div className="bg-slate-50/80 p-5 rounded-xl border border-slate-200/80 space-y-3">
                        <h4 className="text-sm font-bold text-slate-900">İletişim &amp; Bildirim Tercihleri</h4>
                        
                        <div className="space-y-2.5">
                          <label className="flex items-center gap-3 text-sm text-slate-700 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={security.notifications.emailNewMessage}
                              onChange={(e) => setSecurity({
                                ...security,
                                notifications: { ...security.notifications, emailNewMessage: e.target.checked }
                              })}
                              className="w-4 h-4 rounded text-indigo-600 border-slate-300"
                            />
                            <span>Öğrenci veya veliden yeni mesaj geldiğinde e-posta bildirimi gönder</span>
                          </label>

                          <label className="flex items-center gap-3 text-sm text-slate-700 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={security.notifications.smsLessonReminder}
                              onChange={(e) => setSecurity({
                                ...security,
                                notifications: { ...security.notifications, smsLessonReminder: e.target.checked }
                              })}
                              className="w-4 h-4 rounded text-indigo-600 border-slate-300"
                            />
                            <span>Canlı ders başlamadan 15 dakika önce SMS hatırlatması gönder</span>
                          </label>

                          <label className="flex items-center gap-3 text-sm text-slate-700 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={security.notifications.emailHomeworkSubmitted}
                              onChange={(e) => setSecurity({
                                ...security,
                                notifications: { ...security.notifications, emailHomeworkSubmitted: e.target.checked }
                              })}
                              className="w-4 h-4 rounded text-indigo-600 border-slate-300"
                            />
                            <span>Öğrenci ödev teslim ettiğinde e-posta ile haber ver</span>
                          </label>

                          <label className="flex items-center gap-3 text-sm text-slate-700 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={security.notifications.systemAnnouncements}
                              onChange={(e) => setSecurity({
                                ...security,
                                notifications: { ...security.notifications, systemAnnouncements: e.target.checked }
                              })}
                              className="w-4 h-4 rounded text-indigo-600 border-slate-300"
                            />
                            <span>Müfredat yenilikleri ve platform duyuruları</span>
                          </label>
                        </div>
                      </div>

                    </div>

                    {/* Kaydet Butonu */}
                    <div className="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                      <button
                        type="button"
                        onClick={() => handleSave('Güvenlik ve bildirim ayarları')}
                        className="inline-flex items-center gap-2 px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-md shadow-indigo-200 transition"
                      >
                        <Icon name="Save" className="w-4 h-4" />
                        Değişiklikleri Kaydet
                      </button>
                    </div>
                  </div>
                )}


                {/* 6. SEKME: DESTEK MERKEZİ (ALT ENTEGRASYON) */}
                {activeTab === 'support' && (
                  <div>
                    <div className="mb-8">
                      <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Destek Merkezi</h1>
                      <p className="text-sm font-medium text-slate-500 mt-1">Öğretmen Destek Ekibi ve Sıkça Sorulan Sorular</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="p-6 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
                        <div className="w-12 h-12 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">
                          <Icon name="HelpCircle" className="w-6 h-6" />
                        </div>
                        <h3 className="text-base font-bold text-slate-900">Canlı Öğretmen Destek Hattı</h3>
                        <p className="text-xs text-slate-500 leading-relaxed">
                          Canlı ders sırasında ses, görüntü veya entegrasyon problemi yaşarsanız 7/24 teknik ekibimize doğrudan bağlanabilirsiniz.
                        </p>
                        <button
                          type="button"
                          onClick={() => showToast('Canlı destek talebiniz oluşturuldu. 1 dakika içinde bağlanılıyor...')}
                          className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-sm transition"
                        >
                          Canlı Desteğe Bağlan
                        </button>
                      </div>

                      <div className="p-6 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
                        <div className="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">
                          <Icon name="FileText" className="w-6 h-6" />
                        </div>
                        <h3 className="text-base font-bold text-slate-900">Öğretmen Rehberi &amp; SSS</h3>
                        <p className="text-xs text-slate-500 leading-relaxed">
                          Maarif Modeli kazanım testleri hazırlama, soru bankasından çekme ve ödev atama kılavuzunu inceleyin.
                        </p>
                        <a
                          href="/hakkimizda.html"
                          className="inline-flex items-center justify-center gap-1.5 w-full py-2.5 bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold rounded-xl transition"
                        >
                          Kılavuzu İncele
                          <Icon name="ExternalLink" className="w-3.5 h-3.5" />
                        </a>
                      </div>
                    </div>
                  </div>
                )}

              </section>

            </div>

          </main>


          {/* --- MESAJLAR ÇEKMECESİ / MODALI (Öğrenci & Veli Mesaj Havuzu Entegrasyonu) --- */}
          {messagesOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-slate-900/40 backdrop-blur-sm animate-fadeIn">
              <div className="w-full max-w-2xl bg-white h-full shadow-2xl flex flex-col animate-slideLeft">
                
                {/* Mesajlaşma Başlığı */}
                <div className="p-4 sm:p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md">
                      <Icon name="MessageSquare" className="w-5 h-5 text-white" />
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-slate-900">Mesajlaşma &amp; İletişim Kutusu</h3>
                      <p className="text-xs text-slate-500">Öğrenci ve velilerinizden gelen anlık mesajlar</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setMessagesOpen(false)}
                    className="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-200/60 transition"
                  >
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                {/* Mesajlaşma İki Sütunlu Gövde */}
                <div className="flex-1 flex overflow-hidden">
                  
                  {/* Sol: Konuşma Listesi */}
                  <div className="w-1/3 border-r border-slate-200 overflow-y-auto custom-scrollbar p-2 space-y-1">
                    {conversations.map(conv => (
                      <div
                        key={conv.id}
                        onClick={() => setSelectedChatId(conv.id)}
                        className={`p-3 rounded-xl cursor-pointer transition flex items-start gap-2.5 ${
                          selectedChatId === conv.id ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-slate-50'
                        }`}
                      >
                        <div className={`w-8 h-8 rounded-full ${conv.avatarBg} text-white font-bold text-xs flex items-center justify-center shrink-0`}>
                          {conv.avatar}
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center justify-between">
                            <h4 className="text-xs font-bold text-slate-800 truncate">{conv.name}</h4>
                            <span className="text-[10px] text-slate-400">{conv.time}</span>
                          </div>
                          <span className={`text-[10px] font-semibold block ${conv.roleType === 'parent' ? 'text-amber-600' : 'text-emerald-600'}`}>
                            {conv.roleType === 'parent' ? '👨‍👩‍👧 Veli' : '🎒 Öğrenci'}
                          </span>
                          <p className="text-[11px] text-slate-500 truncate mt-0.5">
                            {conv.messages[conv.messages.length - 1]?.text}
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Sağ: Aktif Sohbet Penceresi */}
                  <div className="flex-1 flex flex-col bg-slate-50/50 overflow-hidden">
                    
                    {/* Sohbet Üst Bilgisi */}
                    <div className="p-3.5 bg-white border-b border-slate-200 flex items-center justify-between">
                      <div className="flex items-center gap-2.5">
                        <div className={`w-8 h-8 rounded-full ${currentChat.avatarBg} text-white font-bold text-xs flex items-center justify-center`}>
                          {currentChat.avatar}
                        </div>
                        <div>
                          <h4 className="text-sm font-bold text-slate-800">{currentChat.name}</h4>
                          <span className="text-[11px] text-slate-500 font-medium">{currentChat.role}</span>
                        </div>
                      </div>
                      <a
                        href="/ogretmen-paneli.html#students"
                        className="text-xs font-bold text-indigo-600 hover:underline flex items-center gap-1"
                      >
                        Öğrenci Detayı ↗
                      </a>
                    </div>

                    {/* Mesaj Balonları */}
                    <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-3">
                      {currentChat.messages.map(msg => (
                        <div
                          key={msg.id}
                          className={`flex flex-col max-w-[80%] ${
                            msg.sender === 'teacher' ? 'ml-auto items-end' : 'mr-auto items-start'
                          }`}
                        >
                          <div
                            className={`p-3 rounded-2xl text-xs leading-relaxed shadow-sm ${
                              msg.sender === 'teacher'
                                ? 'bg-indigo-600 text-white rounded-br-none'
                                : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'
                            }`}
                          >
                            {msg.text}
                          </div>
                          <span className="text-[10px] text-slate-400 mt-1 px-1">{msg.time}</span>
                        </div>
                      ))}
                    </div>

                    {/* Cevap Yazma Formu */}
                    <div className="p-3 bg-white border-t border-slate-200 flex gap-2 items-center">
                      <input
                        type="text"
                        value={replyText}
                        onChange={(e) => setReplyText(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                        placeholder={`${currentChat.name} kişisine cevap yaz...`}
                        className="flex-1 px-3.5 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white transition"
                      />
                      <button
                        type="button"
                        onClick={handleSendMessage}
                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition shadow-sm"
                      >
                        <span>Gönder</span>
                        <Icon name="Send" className="w-3.5 h-3.5" />
                      </button>
                    </div>

                  </div>

                </div>

              </div>
            </div>
          )}


          {/* --- FLOATING TOAST NOTIFICATION --- */}
          {toast.show && (
            <div className="fixed bottom-6 right-6 z-50 animate-bounce">
              <div className="flex items-center gap-2.5 px-4 py-3 bg-slate-900 text-white rounded-xl shadow-2xl border border-slate-800 text-xs font-semibold">
                <Icon name="CheckCircle2" className="w-4 h-4 text-emerald-400 shrink-0" />
                <span>{toast.message}</span>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React App
    ReactDOM.createRoot(document.getElementById('root')).render(<TeacherProfileSettingsApp />);
  </script>
</body>
</html>
