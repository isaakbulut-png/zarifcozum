<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Zoom Canlı Ders | ZarifÇözüm</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; background: #4a2e1a; color: #fff; font: 16px system-ui, sans-serif; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  #status[hidden] { display: none; }
</style>
<link rel="stylesheet" href="/assets/live-ai-panel.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script src="https://source.zoom.us/6.10.0/lib/vendor/react.min.js"></script>
<script src="https://source.zoom.us/6.10.0/lib/vendor/react-dom.min.js"></script>
<script src="https://source.zoom.us/6.10.0/lib/vendor/redux.min.js"></script>
<script src="https://source.zoom.us/6.10.0/lib/vendor/redux-thunk.min.js"></script>
<script src="https://source.zoom.us/6.10.0/lib/vendor/react-redux.min.js"></script>
<script src="https://source.zoom.us/6.10.0/lib/vendor/lodash.min.js"></script>
<script src="https://source.zoom.us/zoom-meeting-6.10.0.min.js"></script>
</head>
<body>
<div id="status" role="status" aria-live="polite">Zoom canlı dersine bağlanılıyor…</div>
<div data-live-ai-panel data-floating="true" hidden></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/assets/rich-content.js"></script>
<script src="/assets/safe-svg.js"></script>
<script src="/assets/ai-visual.js"></script>
<script src="/assets/ai-chat.js"></script>
<script src="/assets/live-ai-panel.js"></script>
<script>
(() => {
  if (new URLSearchParams(location.search).has('siteMediaDesigner')) return;
  const status = document.getElementById('status');
  const isHost = new URLSearchParams(location.search).get('role') === 'host';
  const api = async (path, options = {}) => {
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.mesaj || `Sunucu hatası (${response.status})`);
    return data;
  };
  const sdkCall = (method, options) => new Promise((resolve, reject) => {
    window.ZoomMtg[method]({
      ...options,
      success: resolve,
      error: reject
    });
  });
  const errorMessage = error => {
    if (typeof error === 'string') return error;
    if (typeof error?.reason === 'string') return error.reason;
    if (typeof error?.message === 'string') return error.message;
    return 'Zoom hizmetinde beklenmeyen bir hata oluştu.';
  };

  async function joinMeeting() {
    if (!window.ZoomMtg) throw new Error('Zoom Meeting SDK yüklenemedi. Sayfayı yenileyip tekrar deneyin.');

    const credentials = isHost
      ? await api('/api/ogretmen/canli/katilim', {
          method: 'POST'
        })
      : await api('/api/canli/katilim');

    window.ZoomMtg.setZoomJSLib('https://source.zoom.us/6.10.0/lib', '/av');
    window.ZoomMtg.preLoadWasm();
    window.ZoomMtg.prepareWebSDK();
    await sdkCall('init', {
      leaveUrl: `${location.origin}/canli.html`,
      patchJsMedia: true,
      leaveOnPageUnload: true
    });
    await sdkCall('join', {
      signature: credentials.signature,
      sdkKey: credentials.sdkKey,
      meetingNumber: credentials.meetingNumber,
      passWord: credentials.password,
      userName: credentials.userName,
      ...(credentials.zak ? { zak: credentials.zak } : {})
    });
    status.hidden = true;
    await window.liveAiPanel.setRoomId(credentials.meetingNumber);
  }

  joinMeeting().catch(error => {
    status.textContent = `Canlı derse katılınamadı: ${errorMessage(error)}`;
  });
})();
</script>
<script src="/assets/site-footer.js"></script>
<script src="/assets/site-media-targets.js"></script>
<script src="/assets/site-media.js"></script>
</body>
</html>
