<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Giriş / Kayıt | ZarifÇözüm</title>
  <style>
    :root{font-family:Inter,"Segoe UI",sans-serif;color:#3a2618;background:#fbf1e8;font-synthesis:none}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:flex;flex-direction:column}
    body>main.card{margin:48px auto;max-width:calc(100% - 32px)}
    body>.site-footer{width:100%;margin-top:auto}
    .card{width:min(100%,440px);padding:32px;background:#fffaf5;border:1px solid #d9d3c3;border-radius:20px;box-shadow:0 20px 60px rgba(49, 36, 24,.12)}
    .brand{margin:0 0 6px;font-size:1.55rem;color:#4a2e1a}
    .intro{margin:0 0 24px;color:#6a5242}
    .switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px;padding:5px;border-radius:10px;background:#f3e1cf}
    .switch button{padding:10px;border:0;border-radius:7px;background:transparent;color:#6a5242;font:inherit;font-weight:600;cursor:pointer}
    .switch button[aria-pressed=true]{background:#fffaf5;color:#523520;box-shadow:0 1px 5px rgba(49, 36, 24,.12)}
    .parent-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:0 0 18px}
    label{display:block;margin:15px 0 6px;font-size:.92rem;font-weight:600}
    input,select{width:100%;padding:12px;border:1px solid #d9d3c3;border-radius:8px;background:#fffaf5;color:inherit;font:inherit}
    input:focus,select:focus,button:focus-visible{outline:3px solid rgba(125, 90, 60,.3);border-color:#7a4f2d}
    .primary{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#7a4f2d;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    .primary:hover{background:#6b4a2f}
    .message{min-height:1.4em;margin:12px 0 0;color:#a3201a;font-size:.9rem}
    .back{display:block;margin-top:18px;text-align:center;color:#6a5242;text-decoration:none}
    .google-wrap{margin-bottom:6px}
    #googleButton{display:flex;justify-content:center}
    .google-disabled{margin:0;color:#6a5242;font-size:.85rem;text-align:center}
    .divider{display:flex;align-items:center;gap:12px;margin:16px 0 4px;color:#8b7565;font-size:.85rem}
    .divider:before,.divider:after{content:"";height:1px;flex:1;background:#e5d9c8}
    .forgot-row{display:flex;justify-content:flex-end;margin-top:10px}
    .text-button{padding:0;border:0;background:none;color:#7a4f2d;font:inherit;font-size:.88rem;font-weight:600;text-decoration:underline;cursor:pointer}
    .message.success{color:#37674c}
    .back-link{display:block;margin-top:14px;text-align:center}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <h1 class="brand">ZarifÇözüm</h1>
    <p class="intro" id="intro">Hesabınıza giriş yapın veya yeni hesap oluşturun.</p>
    <div id="authOptions">
    <div class="google-wrap" id="googleWrap"><div id="googleButton"></div><p class="google-disabled" id="googleDisabled" hidden>Google ile giriş bu sitede henüz etkinleştirilmedi.</p></div>
    <div class="divider" id="googleDivider"><span>veya e-posta ile</span></div>
    <div class="parent-actions">
      <button class="text-button" id="parentLoginMode" type="button">Veli Girişi</button>
      <button class="text-button" id="parentRegisterMode" type="button">Veli Kayıt Ol</button>
    </div>
    <div class="switch" aria-label="İşlem seçin">
      <button id="loginMode" type="button" aria-pressed="true">Giriş yap</button>
      <button id="registerMode" type="button" aria-pressed="false">Kayıt ol</button>
    </div>
    <form id="authForm" action="/login" method="post">
      <div id="nameField" hidden>
        <label for="name">Ad soyad</label>
        <input id="name" name="name" autocomplete="name" maxlength="100" disabled>
      </div>
      <label for="email">E-posta</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <div id="phoneField" hidden>
        <label for="phone">Telefon numarası</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx" maxlength="20" disabled>
      </div>
      <div id="surnameField" hidden>
        <label for="surname">Soyad</label>
        <input id="surname" name="surname" autocomplete="family-name" maxlength="100" disabled>
      </div>
      <label for="password">Şifre</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="72" required>
      <div id="confirmField" hidden>
        <label for="passwordConfirmation">Şifreyi tekrar girin</label>
        <input id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="10" maxlength="72" disabled>
      </div>
      <div id="roleField" hidden>
        <label for="role">Kullanıcı tipi</label>
        <select id="role" name="role" disabled>
          <option value="student">Öğrenci</option>
          <option value="teacher">Öğretmen</option>
        </select>
      </div>
      <div id="teacherCodeField" hidden>
        <label for="teacherCode">Öğretmen davet kodu</label>
        <input id="teacherCode" name="teacherCode" type="password" autocomplete="off" disabled>
      </div>
      <div id="parentCodeField" hidden>
        <label for="parentConnectionCode">6 karakterli veli bağlantı kodu</label>
        <input id="parentConnectionCode" name="parentConnectionCode" autocomplete="off" autocapitalize="characters" maxlength="6" pattern="[A-Za-z0-9]{6}" disabled>
      </div>
      <div class="forgot-row" id="forgotRow"><button class="text-button" id="forgotLink" type="button">Şifremi unuttum</button></div>
      <button class="primary" id="submitButton" type="submit">Giriş yap</button>
      <p class="message" id="message" role="alert" aria-live="polite"></p>
    </form>
    </div>

    <form id="forgotForm" hidden>
      <p class="intro">E-posta adresinizi girin; şifre yenileme bağlantısını gönderelim.</p>
      <label for="forgotEmail">E-posta</label>
      <input id="forgotEmail" type="email" autocomplete="email" maxlength="254" required>
      <button class="primary" type="submit">Sıfırlama bağlantısı gönder</button>
      <p class="message" id="forgotMessage" role="status" aria-live="polite"></p>
      <p class="back-link"><button class="text-button" type="button" data-mode="login">Girişe dön</button></p>
    </form>

    <form id="resetForm" hidden>
      <p class="intro">Hesabınız için yeni ve güvenli bir şifre belirleyin.</p>
      <label for="resetEmail">E-posta</label>
      <input id="resetEmail" type="email" autocomplete="email" readonly required>
      <label for="resetPassword">Yeni şifre</label>
      <input id="resetPassword" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <label for="resetConfirmation">Yeni şifreyi tekrar girin</label>
      <input id="resetConfirmation" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <button class="primary" type="submit">Şifremi yenile</button>
      <p class="message" id="resetMessage" role="status" aria-live="polite"></p>
    </form>
    <a class="back" href="index.html">Ana sayfaya dön</a>
  </main>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const params = new URLSearchParams(window.location.search);
      let mode = 'login';
      let parentMode = params.get('role') === 'parent';
      let googleReady = false;
      const resetToken = params.get('token') || '';
      const resetEmail = params.get('email') || '';

      function apiError(data, fallback) {
        return data && typeof data.mesaj === 'string' ? data.mesaj : fallback;
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          credentials: 'same-origin'
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(apiError(result, 'İşlem tamamlanamadı.'));
        return result;
      }

      function setMessage(id, text, success = false) {
        $(id).textContent = text;
        $(id).classList.toggle('success', success);
      }

      function setMode(nextMode) {
        mode = nextMode;
        const registering = mode === 'register';
        const parentRegistration = registering && parentMode;
        const forgot = mode === 'forgot';
        const resetting = mode === 'reset';
        $('authOptions').hidden = forgot || resetting;
        $('forgotForm').hidden = !forgot;
        $('resetForm').hidden = !resetting;
        $('loginMode').setAttribute('aria-pressed', String(!registering));
        $('registerMode').setAttribute('aria-pressed', String(registering));
        for (const id of ['nameField', 'phoneField', 'confirmField']) {
          $(id).hidden = !registering;
          $(id).querySelector('input, select').disabled = !registering;
        }
        $('roleField').hidden = !registering || parentMode;
        $('role').disabled = !registering || parentMode;
        $('surnameField').hidden = !parentRegistration;
        $('surname').disabled = !parentRegistration;
        $('surname').required = parentRegistration;
        $('parentCodeField').hidden = !parentRegistration;
        $('parentConnectionCode').disabled = !parentRegistration;
        $('parentConnectionCode').required = parentRegistration;
        $('googleWrap').hidden = parentMode;
        $('googleDivider').hidden = parentMode;
        $('nameField').querySelector('label').textContent = parentMode ? 'Ad' : 'Ad soyad';
        $('name').required = registering;
        $('phone').required = registering;
        $('forgotRow').hidden = registering;
        $('passwordConfirmation').required = registering;
        $('password').autocomplete = registering ? 'new-password' : 'current-password';
        $('teacherCodeField').hidden = !registering || parentMode || $('role').value !== 'teacher';
        $('teacherCode').disabled = $('teacherCodeField').hidden;
        $('teacherCode').required = !$('teacherCodeField').hidden;
        $('submitButton').textContent = parentRegistration ? 'Veli hesabı oluştur' : registering ? 'Hesap oluştur' : 'Giriş yap';
        $('authForm').action = parentMode
          ? parentRegistration ? '/parent/register' : '/parent/login'
          : registering ? '/register' : '/login';
        $('authForm').method = 'post';
        $('intro').textContent = parentMode
          ? parentRegistration
            ? 'Çocuğunuzun panelindeki bağlantı koduyla veli hesabınızı oluşturun.'
            : 'Veli hesabınızla giriş yapın.'
          : registering
          ? 'Hesabınızı oluşturmak için bilgilerinizi girin.'
          : params.get('role') === 'teacher'
            ? 'Öğretmen hesabınızla giriş yapın.'
            : 'Öğrenci hesabınızla giriş yapın.';
        $('message').textContent = '';
      }

      $('loginMode').addEventListener('click', () => {
        parentMode = false;
        setMode('login');
      });
      $('registerMode').addEventListener('click', () => {
        parentMode = false;
        setMode('register');
      });
      $('parentLoginMode').addEventListener('click', () => {
        parentMode = true;
        setMode('login');
      });
      $('parentRegisterMode').addEventListener('click', () => {
        parentMode = true;
        setMode('register');
      });
      $('role').addEventListener('change', () => setMode(mode));
      $('forgotLink').addEventListener('click', () => {
        $('forgotEmail').value = $('email').value;
        setMode('forgot');
      });
      document.querySelectorAll('[data-mode="login"]').forEach(button => button.addEventListener('click', () => setMode('login')));

      $('forgotForm').addEventListener('submit', async event => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('button[type="submit"]');
        button.disabled = true;
        setMessage('forgotMessage', '');
        try {
          const result = await postJson('/forgot-password', {email: $('forgotEmail').value});
          setMessage('forgotMessage', result.mesaj, true);
        } catch (error) {
          setMessage('forgotMessage', error.message || 'Sunucuya bağlanılamadı.');
        } finally {
          button.disabled = false;
        }
      });

      $('resetForm').addEventListener('submit', async event => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('button[type="submit"]');
        button.disabled = true;
        setMessage('resetMessage', '');
        try {
          const result = await postJson('/reset-password', {
            email: $('resetEmail').value,
            token: resetToken,
            password: $('resetPassword').value,
            passwordConfirmation: $('resetConfirmation').value
          });
          setMessage('resetMessage', result.mesaj, true);
          setTimeout(() => setMode('login'), 1600);
        } catch (error) {
          setMessage('resetMessage', error.message || 'Sunucuya bağlanılamadı.');
          button.disabled = false;
        }
      });

      async function onGoogleCredential(response) {
        try {
          const result = await postJson('/auth/google', {
            credential: response.credential,
            intent: mode === 'register' ? 'register' : 'login',
            role: $('role').value,
            teacherCode: $('teacherCode').value
          });
          window.location.assign(result.redirectTo);
        } catch (error) {
          $('message').textContent = error.message || 'Google girişi başarısız oldu.';
        }
      }

      async function setupGoogle() {
        try {
          const response = await fetch('/auth/config', {credentials: 'same-origin'});
          const config = await response.json();
          if (!response.ok || !config.googleClientId) throw new Error();
          const script = document.createElement('script');
          script.src = 'https://accounts.google.com/gsi/client';
          script.async = true;
          script.defer = true;
          script.onload = () => {
            if (!window.google?.accounts?.id) { $('googleDisabled').hidden = false; return; }
            window.google.accounts.id.initialize({client_id: config.googleClientId, callback: onGoogleCredential});
            window.google.accounts.id.renderButton($('googleButton'), {
              type: 'standard', theme: 'outline', size: 'large', text: 'continue_with',
              shape: 'rectangular', width: 376, locale: 'tr'
            });
            googleReady = true;
          };
          script.onerror = () => { $('googleDisabled').hidden = false; };
          document.head.append(script);
        } catch (error) {
          $('googleDisabled').hidden = false;
        }
      }
      $('authForm').addEventListener('submit', async event => {
        event.preventDefault();
        $('submitButton').disabled = true;
        $('message').textContent = '';
        const data = Object.fromEntries(new FormData(event.currentTarget));
        try {
          const response = await fetch(event.currentTarget.action, {
            method: event.currentTarget.method.toUpperCase(),
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
            credentials: 'same-origin'
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.mesaj || 'İşlem tamamlanamadı.');
          window.location.assign(result.redirectTo);
        } catch (error) {
          $('message').textContent = error.message || 'Sunucuya bağlanılamadı.';
          $('submitButton').disabled = false;
        }
      });

      if (params.get('role') === 'teacher') $('role').value = 'teacher';
      setupGoogle();
      if (resetToken && resetEmail) {
        $('resetEmail').value = resetEmail;
        setMode('reset');
      } else {
        setMode(params.get('mode') === 'register' ? 'register' : 'login');
      }
    })();
  </script>
  <script src="/assets/site-footer.js"></script>
  <script src="/assets/breadcrumb.js"></script>
</body>
</html>
