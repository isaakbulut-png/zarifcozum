<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Yönetim Paneli | ZarifÇözüm</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{font-family:Inter,"Segoe UI",sans-serif;color:#1d2d25;background:#f7f5ef;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;grid-template-columns:260px 1fr}
    aside{position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 14px;background:#12372a;color:#e8f1ec;display:flex;flex-direction:column}
    aside h1{margin:0 8px 4px;font-size:1.2rem}
    aside .sub{margin:0 8px 18px;font-size:.78rem;color:#9fbfb0}
    .nav-title{margin:16px 8px 6px;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:#7fa593}
    .nav-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;font-size:.92rem;text-align:left;cursor:pointer}
    .nav-btn:hover:not(:disabled){background:rgba(255,255,255,.08)}
    .nav-btn[aria-current=page]{background:#267456;color:#fff;font-weight:600}
    .nav-btn:disabled{opacity:.45;cursor:not-allowed}
    .soon{padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.14);font-size:.65rem;font-weight:700;letter-spacing:.04em}
    .logout{margin-top:auto}
    main{padding:28px clamp(16px,3vw,40px);min-width:0}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
    .topbar h2{margin:0;font-size:1.5rem;color:#12372a}
    .who{color:#58685e;font-size:.9rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
    .stat,.panel{background:#fffefa;border:1px solid #d9d3c3;border-radius:14px}
    .stat{padding:16px}
    .stat span{display:block;color:#58685e;font-size:.82rem}
    .stat strong{display:block;margin-top:6px;font-size:1.8rem;color:#12372a}
    .panel{padding:20px;margin-top:18px}
    .panel h3{margin:0 0 14px;font-size:1.05rem;color:#12372a}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    input,select,textarea{padding:10px 12px;border:1px solid #d9d3c3;border-radius:8px;background:#fffefa;color:inherit;font:inherit}
    textarea{width:100%;min-height:90px;resize:vertical}
    input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(46,139,104,.3);border-color:#267456}
    .btn{padding:10px 16px;border:1px solid #d9d3c3;border-radius:8px;background:#fffefa;color:#184d3b;font:inherit;font-weight:600;cursor:pointer}
    .btn:hover:not(:disabled){background:#eeeade}
    .btn.primary{background:#267456;border-color:#267456;color:#fff}
    .btn.primary:hover:not(:disabled){background:#1f6249}
    .btn.danger{color:#b93838}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn.sm{padding:6px 10px;font-size:.82rem}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th,td{padding:10px 12px;border-bottom:1px solid #e8e2d6;text-align:left;white-space:nowrap}
    th{color:#58685e;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
    .chip{display:inline-block;padding:2px 9px;border-radius:999px;background:#eeeade;font-size:.78rem;font-weight:600}
    .chip.ok{background:#e0f0e5;color:#26734d}
    .chip.warn{background:#f6ead2;color:#805a1b}
    .chip.bad{background:#f8dede;color:#b93838}
    .empty{padding:20px;text-align:center;color:#58685e}
    .pager{display:flex;align-items:center;gap:10px;margin-top:14px;color:#58685e;font-size:.88rem}
    .notice{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:#f6ead2;color:#805a1b;font-size:.88rem}
    .msg{min-height:1.3em;margin:8px 0 0;font-size:.88rem;color:#a3201a}
    .msg.ok{color:#26734d}
    .announcement{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e8e2d6}
    .announcement p{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
    .announcement small{color:#58685e}
    [hidden]{display:none!important}
    @media (max-width:820px){body{grid-template-columns:1fr}aside{position:static;height:auto}.logout{margin-top:16px}}
  </style>
</head>
<body>
  <aside>
    <h1>ZarifÇözüm</h1>
    <p class="sub">Yönetim Paneli</p>

    <div class="nav-title">GENEL</div>
    <button class="nav-btn" type="button" data-view="overview" aria-current="page">Genel Bakış</button>
    <button class="nav-btn" type="button" data-view="users">Kullanıcılar</button>
    <button class="nav-btn" type="button" data-view="payments">Ödemeler</button>
    <button class="nav-btn" type="button" data-view="announcements">Duyurular</button>

    <div class="nav-title">EĞİTİM</div>
    <button class="nav-btn" type="button" disabled>Dersler ve Canlı Ders <span class="soon">YAKINDA</span></button>
    <button class="nav-btn" type="button" disabled>Konu Anlatımları <span class="soon">YAKINDA</span></button>
    <button class="nav-btn" type="button" disabled>Testler ve Quizler <span class="soon">YAKINDA</span></button>
    <button class="nav-btn" type="button" disabled>Deneme Sınavları <span class="soon">YAKINDA</span></button>
    <button class="nav-btn" type="button" disabled>Yapay Zekâ İçerikleri <span class="soon">YAKINDA</span></button>

    <div class="nav-title">İŞLETME</div>
    <button class="nav-btn" type="button" disabled>Abonelikler ve Paketler <span class="soon">YAKINDA</span></button>
    <button class="nav-btn" type="button" disabled>Raporlar ve Analitik <span class="soon">YAKINDA</span></button>
    <button class="nav-btn" type="button" disabled>Destek Talepleri <span class="soon">YAKINDA</span></button>

    <div class="nav-title">SİSTEM</div>
    <button class="nav-btn" type="button" disabled>Site Ayarları <span class="soon">YAKINDA</span></button>
    <button class="nav-btn" type="button" disabled>Güvenlik ve Kayıtlar <span class="soon">YAKINDA</span></button>
    <button class="nav-btn" type="button" disabled>Yedekleme <span class="soon">YAKINDA</span></button>

    <button class="nav-btn logout" type="button" id="logoutButton">Çıkış yap</button>
  </aside>

  <main>
    <div class="topbar">
      <h2 id="viewTitle">Genel Bakış</h2>
      <span class="who" id="who"></span>
    </div>

    <section id="view-overview">
      <div class="grid" id="stats"></div>
      <p class="msg" id="overviewMsg" role="alert"></p>
    </section>

    <section id="view-users" hidden>
      <div class="panel" style="margin-top:0">
        <div class="toolbar">
          <input id="userSearch" type="search" placeholder="Ad veya e-posta ara" maxlength="100" aria-label="Kullanıcı ara">
          <select id="userRole" aria-label="Rol filtresi">
            <option value="">Tüm roller</option>
            <option value="student">Öğrenci</option>
            <option value="teacher">Öğretmen</option>
            <option value="admin">Yönetici</option>
          </select>
          <button class="btn primary" type="button" id="userSearchButton">Ara</button>
          <button class="btn" type="button" disabled title="Yakında">Yeni kullanıcı ekle</button>
          <button class="btn" type="button" disabled title="Yakında">Dışa aktar</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Ad</th><th>E-posta</th><th>Rol</th><th>Abonelik</th><th>Kayıt tarihi</th><th>İşlemler</th></tr></thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
        <div class="pager">
          <button class="btn sm" type="button" id="prevPage">Önceki</button>
          <span id="pageInfo"></span>
          <button class="btn sm" type="button" id="nextPage">Sonraki</button>
        </div>
        <p class="msg" id="usersMsg" role="alert"></p>
      </div>
    </section>

    <section id="view-payments" hidden>
      <div class="panel" style="margin-top:0">
        <div class="toolbar">
          <select id="paymentStatus" aria-label="Ödeme durumu">
            <option value="">Tüm durumlar</option>
            <option value="paid">Ödendi</option>
            <option value="pending">Beklemede</option>
            <option value="failed">Başarısız</option>
          </select>
          <button class="btn" type="button" disabled title="Yakında">İade başlat</button>
          <button class="btn" type="button" disabled title="Yakında">Dışa aktar</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Sipariş</th><th>Kullanıcı</th><th>Plan</th><th>Tutar</th><th>Sağlayıcı</th><th>Durum</th><th>Tarih</th></tr></thead>
            <tbody id="paymentsBody"></tbody>
          </table>
        </div>
        <p class="msg" id="paymentsMsg" role="alert"></p>
      </div>
    </section>

    <section id="view-announcements" hidden>
      <div class="panel" style="margin-top:0">
        <h3>Yeni duyuru</h3>
        <form id="announcementForm">
          <textarea id="announcementText" maxlength="1000" placeholder="Duyuru metni (en fazla 1000 karakter)" required></textarea>
          <div class="toolbar" style="margin-top:10px">
            <button class="btn primary" type="submit">Yayınla</button>
            <button class="btn" type="button" disabled title="Yakında">Zamanlanmış duyuru</button>
          </div>
          <p class="msg" id="announcementMsg" role="alert"></p>
        </form>
      </div>
      <div class="panel">
        <h3>Yayındaki duyurular</h3>
        <div id="announcementList"></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const titles = { overview: 'Genel Bakış', users: 'Kullanıcılar', payments: 'Ödemeler', announcements: 'Duyurular' };
      const roleNames = { student: 'Öğrenci', teacher: 'Öğretmen', admin: 'Yönetici' };
      const subNames = { free: 'Ücretsiz', active: 'Aktif', expired: 'Süresi doldu' };
      const payNames = { paid: ['Ödendi', 'ok'], pending: ['Beklemede', 'warn'], failed: ['Başarısız', 'bad'] };
      const planNames = { monthly: 'Aylık', yearly: 'Yıllık' };
      const loaders = { overview: loadOverview, users: loadUsers, payments: loadPayments, announcements: loadAnnouncements };
      let page = 1;
      let totalPages = 1;

      async function api(url, options = {}) {
        const response = await fetch(url, {
          credentials: 'same-origin',
          ...options,
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
        });
        if (response.status === 401 || response.status === 403) {
          window.location.assign('/yonetim');
          throw new Error('Oturum sona erdi.');
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.mesaj || 'İşlem tamamlanamadı.');
        return data;
      }

      const fmtDate = value => value ? new Date(value).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

      function cell(row, text, className) {
        const td = document.createElement('td');
        if (className) {
          const chip = document.createElement('span');
          chip.className = `chip ${className}`;
          chip.textContent = text;
          td.append(chip);
        } else {
          td.textContent = text;
        }
        row.append(td);
        return td;
      }

      function emptyRow(body, columns, text) {
        body.replaceChildren();
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = columns;
        td.className = 'empty';
        td.textContent = text;
        tr.append(td);
        body.append(tr);
      }

      function showView(name) {
        for (const key of Object.keys(titles)) $(`view-${key}`).hidden = key !== name;
        document.querySelectorAll('[data-view]').forEach(button => {
          if (button.dataset.view === name) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        $('viewTitle').textContent = titles[name];
        loaders[name]();
      }

      async function loadOverview() {
        $('overviewMsg').textContent = '';
        try {
          const data = await api('/api/admin/overview');
          const items = [
            ['Öğrenci', data.students], ['Öğretmen', data.teachers], ['Yönetici', data.admins],
            ['Aktif abonelik', data.activeSubs], ['Başarılı ödeme', data.paidPayments],
            ['Bekleyen ödeme', data.pendingPayments], ['Duyuru', data.announcements]
          ];
          $('stats').replaceChildren(...items.map(([label, value]) => {
            const box = document.createElement('div');
            box.className = 'stat';
            const span = document.createElement('span');
            span.textContent = label;
            const strong = document.createElement('strong');
            strong.textContent = value;
            box.append(span, strong);
            return box;
          }));
        } catch (error) { $('overviewMsg').textContent = error.message; }
      }

      async function loadUsers() {
        $('usersMsg').textContent = '';
        const params = new URLSearchParams({ page });
        if ($('userSearch').value.trim()) params.set('q', $('userSearch').value.trim());
        if ($('userRole').value) params.set('role', $('userRole').value);
        try {
          const data = await api(`/api/admin/users?${params}`);
          totalPages = Math.max(1, Math.ceil(data.total / data.pageSize));
          $('pageInfo').textContent = `Sayfa ${data.page} / ${totalPages} · ${data.total} kayıt`;
          $('prevPage').disabled = data.page <= 1;
          $('nextPage').disabled = data.page >= totalPages;
          if (!data.users.length) return emptyRow($('usersBody'), 6, 'Kullanıcı bulunamadı.');
          $('usersBody').replaceChildren(...data.users.map(user => {
            const tr = document.createElement('tr');
            cell(tr, user.name);
            cell(tr, user.email);
            cell(tr, roleNames[user.role] || user.role, user.role === 'admin' ? 'warn' : '');
            cell(tr, subNames[user.subscriptionStatus] || '—', user.subscriptionStatus === 'active' ? 'ok' : '');
            cell(tr, fmtDate(user.createdAt));
            const actions = cell(tr, '');
            for (const label of ['Düzenle', 'Askıya al', 'Sil']) {
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'btn sm';
              button.textContent = label;
              button.disabled = true;
              button.title = 'Yakında';
              button.style.marginRight = '6px';
              actions.append(button);
            }
            return tr;
          }));
        } catch (error) { $('usersMsg').textContent = error.message; }
      }

      async function loadPayments() {
        $('paymentsMsg').textContent = '';
        const params = new URLSearchParams();
        if ($('paymentStatus').value) params.set('status', $('paymentStatus').value);
        try {
          const data = await api(`/api/admin/payments?${params}`);
          if (!data.payments.length) return emptyRow($('paymentsBody'), 7, 'Ödeme kaydı yok.');
          $('paymentsBody').replaceChildren(...data.payments.map(payment => {
            const tr = document.createElement('tr');
            cell(tr, payment.orderReference);
            cell(tr, `${payment.userName} (${payment.userEmail})`);
            cell(tr, planNames[payment.subscriptionType] || payment.subscriptionType);
            cell(tr, `${payment.amount.toLocaleString('tr-TR', { minimumFractionDigits: 2 })} ${payment.currency}`);
            cell(tr, payment.gateway);
            const [label, kind] = payNames[payment.status] || [payment.status, ''];
            cell(tr, label, kind);
            cell(tr, fmtDate(payment.paidAt || payment.createdAt));
            return tr;
          }));
        } catch (error) { $('paymentsMsg').textContent = error.message; }
      }

      async function loadAnnouncements() {
        try {
          const data = await api('/api/admin/announcements');
          const list = $('announcementList');
          if (!data.duyurular.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'Henüz duyuru yok.';
            return list.replaceChildren(empty);
          }
          list.replaceChildren(...data.duyurular.map(item => {
            const row = document.createElement('div');
            row.className = 'announcement';
            const text = document.createElement('div');
            const p = document.createElement('p');
            p.textContent = item.message;
            const small = document.createElement('small');
            small.textContent = fmtDate(item.createdAt);
            text.append(p, small);
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'btn sm danger';
            del.textContent = 'Sil';
            del.addEventListener('click', async () => {
              if (!confirm('Bu duyuru silinsin mi?')) return;
              try {
                await api(`/api/admin/announcements/${encodeURIComponent(item.id)}`, { method: 'DELETE' });
                loadAnnouncements();
              } catch (error) { $('announcementMsg').textContent = error.message; }
            });
            row.append(text, del);
            return row;
          }));
        } catch (error) { $('announcementMsg').textContent = error.message; }
      }

      document.querySelectorAll('[data-view]').forEach(button =>
        button.addEventListener('click', () => showView(button.dataset.view)));
      $('userSearchButton').addEventListener('click', () => { page = 1; loadUsers(); });
      $('userSearch').addEventListener('keydown', event => { if (event.key === 'Enter') { page = 1; loadUsers(); } });
      $('userRole').addEventListener('change', () => { page = 1; loadUsers(); });
      $('prevPage').addEventListener('click', () => { if (page > 1) { page -= 1; loadUsers(); } });
      $('nextPage').addEventListener('click', () => { if (page < totalPages) { page += 1; loadUsers(); } });
      $('paymentStatus').addEventListener('change', loadPayments);

      $('announcementForm').addEventListener('submit', async event => {
        event.preventDefault();
        const message = $('announcementMsg');
        message.className = 'msg';
        message.textContent = '';
        try {
          const data = await api('/api/admin/announcements', {
            method: 'POST',
            body: JSON.stringify({ message: $('announcementText').value })
          });
          $('announcementText').value = '';
          message.className = 'msg ok';
          message.textContent = data.mesaj;
          loadAnnouncements();
        } catch (error) { message.textContent = error.message; }
      });

      $('logoutButton').addEventListener('click', async () => {
        await fetch('/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
        window.location.assign('/yonetim');
      });

      fetch('/me', { credentials: 'same-origin' })
        .then(response => response.ok ? response.json() : Promise.reject())
        .then(data => { $('who').textContent = `${data.user.name} · ${data.user.email}`; })
        .catch(() => window.location.assign('/yonetim'));

      loadOverview();
    })();
  </script>
</body>
</html>
