<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF6F0">
  <title>Kendini Dene: 5 Soruluk Mini Kontrol | ZarifÇözüm</title>
  <meta name="description" content="5–12. sınıf MEB Maarif Modeli uyumlu 5 soruluk mini kontrol testi. Yanlış sorularının adım adım çözümlerini anında gör.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site-navbar.css?v=1">
  <link rel="stylesheet" href="assets/freemium-studio.css?v=1">
  <script src="assets/site-navbar.js?v=1" defer></script>
</head>
<body class="zfs-body">
  <header class="site-header"></header>

  <main class="zfs-container">
    <!-- Üst Başlık & Sınıf Seçici -->
    <section class="zfs-hero-bar" aria-label="Kendini Dene Sınıf Seçimi">
      <div class="zfs-eyebrow">🎯 KAYIT OLMADAN HIZLI SEVİYE ÖLÇÜMÜ</div>
      <h1 class="zfs-page-title">Kendini Dene: 5 Soruluk Mini Kontrol</h1>
      <p class="zfs-page-desc">
        Sınıfını seç ve 5 soruluk yeni nesil mini kontrolü hemen başlat. 5–8. sınıflarda 4 şıklı, 9–12. sınıflarda 5 şıklı özgün sorularla seviyeni ölç; test sonunda yanlışlarının adım adım çözüm basamaklarını incele.
      </p>
      <nav class="zfs-grade-bar" id="zfsTestGradeBar" aria-label="Sınıf Seçimi">
        <button type="button" class="zfs-grade-btn" data-grade="5">5. Sınıf</button>
        <button type="button" class="zfs-grade-btn" data-grade="6">6. Sınıf</button>
        <button type="button" class="zfs-grade-btn" data-grade="7">7. Sınıf</button>
        <button type="button" class="zfs-grade-btn" data-grade="8">8. Sınıf (LGS)</button>
        <button type="button" class="zfs-grade-btn" data-grade="9">9. Sınıf</button>
        <button type="button" class="zfs-grade-btn" data-grade="10">10. Sınıf</button>
        <button type="button" class="zfs-grade-btn" data-grade="11">11. Sınıf</button>
        <button type="button" class="zfs-grade-btn" data-grade="12">12. Sınıf (YKS)</button>
      </nav>
    </section>

    <!-- İnteraktif 5 Soruluk Mini Kontrol Alanı -->
    <section class="zfs-quiz-shell" id="zfsQuizShell" aria-live="polite"></section>
  </main>

  <script src="assets/mufredat-verileri.js?v=1"></script>
  <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var rawGrade = params.get("sinif");
      var activeGrade = (rawGrade && window.MUFREDAT_VERILERI[rawGrade]) ? rawGrade : "5";

      var qIndex = 0;
      var answers = [];

      var shellEl = document.getElementById("zfsQuizShell");
      var gradeButtons = Array.prototype.slice.call(document.querySelectorAll("#zfsTestGradeBar .zfs-grade-btn"));

      function esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function updateUrl() {
        try {
          var url = new URL(window.location.href);
          url.searchParams.set("sinif", activeGrade);
          window.history.replaceState({}, "", url.toString());
        } catch (e) {}
      }

      function syncGradeBar() {
        gradeButtons.forEach(function (btn) {
          btn.classList.toggle("is-active", btn.dataset.grade === activeGrade);
        });
      }

      function renderSetup() {
        syncGradeBar();
        updateUrl();

        var data = window.ZarifMufredatYardimci.getSinif(activeGrade);
        var openKonular = (data.konular || []).filter(function (k) { return k.ucretsiz; });
        var sikLabel = data.sikSayisi === 5 ? "5 Şıklı (A–E • Lise/YKS Formatı)" : "4 Şıklı (A–D • Ortaokul/LGS Formatı)";

        var cardsHtml = openKonular.map(function (k, idx) {
          return (
            '<div class="zfs-pick-card is-selected" style="cursor:default;">' +
              '<span class="zfs-badge-free">✓ Kapsanan Açık Konu ' + (idx + 1) + '</span>' +
              '<h4>' + esc(k.baslik) + '</h4>' +
              '<p>' + esc(k.kazanim) + '</p>' +
            '</div>'
          );
        }).join("");

        shellEl.innerHTML =
          '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;">' +
            '<h2 style="margin:0;font-size:1.5rem;font-weight:800;">' + esc(data.baslik) + ' — 5 Soruluk Mini Kontrol</h2>' +
            '<span class="zfs-badge-lock">' + esc(sikLabel) + '</span>' +
          '</div>' +
          '<p style="margin:0;color:#6E5A4F;">Bu mini kontrol, ' + activeGrade + '. sınıfın aşağıdaki 2 temel konusundan seçilmiş 5 özgün soruyu içerir.</p>' +
          '<div class="zfs-topic-picker">' + cardsHtml + '</div>' +
          '<div class="zfs-btn-row" style="justify-content:flex-start;">' +
            '<button type="button" class="zfs-btn-emerald" id="zfsStartQuizBtn">🎯 5 Soruluk Mini Kontrolü Başlat →</button>' +
            '<a class="zfs-btn-outline" href="konu.html?sinif=' + encodeURIComponent(activeGrade) + '">← Konu Stüdyosuna Dön</a>' +
          '</div>';

        document.getElementById("zfsStartQuizBtn").addEventListener("click", function () {
          var questions = data.miniTest || [];
          if (!questions.length) return;
          qIndex = 0;
          answers = new Array(questions.length).fill(null);
          renderQuiz();
        });
      }

      function renderQuiz() {
        var data = window.ZarifMufredatYardimci.getSinif(activeGrade);
        var questions = data.miniTest || [];
        var total = questions.length;
        var item = questions[qIndex];
        var pct = Math.round(((qIndex + 1) / total) * 100);
        var letters = ["A", "B", "C", "D", "E"];

        var optsHtml = item.siklar.map(function (opt, oIdx) {
          var isSel = answers[qIndex] === oIdx;
          return (
            '<button type="button" class="zfs-opt-btn' + (isSel ? ' is-selected' : '') + '" data-opt="' + oIdx + '">' +
              '<span class="zfs-opt-letter">' + letters[oIdx] + '</span>' +
              '<span>' + esc(opt) + '</span>' +
            '</button>'
          );
        }).join("");

        var isLast = qIndex === total - 1;
        shellEl.innerHTML =
          '<div class="zfs-quiz-progress-wrap">' +
            '<span class="zfs-badge-free">' + activeGrade + '. Sınıf • ' + esc(item.konu) + '</span>' +
            '<div class="zfs-quiz-track"><div class="zfs-quiz-fill" style="width:' + pct + '%;"></div></div>' +
            '<strong style="white-space:nowrap;">Soru ' + (qIndex + 1) + ' / ' + total + '</strong>' +
          '</div>' +
          '<p class="zfs-quiz-question">' + (qIndex + 1) + '. ' + esc(item.soru) + '</p>' +
          '<div class="zfs-quiz-options">' + optsHtml + '</div>' +
          '<div class="zfs-btn-row" style="justify-content:space-between;">' +
            '<button type="button" class="zfs-btn-outline" id="zfsPrevQBtn"' + (qIndex === 0 ? ' disabled style="opacity:.45;cursor:not-allowed;"' : '') + '>← Önceki</button>' +
            '<button type="button" class="' + (isLast ? 'zfs-btn-emerald' : 'zfs-btn-primary') + '" id="zfsNextQBtn">' +
              (isLast ? 'Testi Bitir ve Çözümleri Gör ✓' : 'Sonraki Soru →') +
            '</button>' +
          '</div>';

        shellEl.querySelectorAll("[data-opt]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            answers[qIndex] = Number(btn.getAttribute("data-opt"));
            renderQuiz();
          });
        });

        document.getElementById("zfsPrevQBtn").addEventListener("click", function () {
          if (qIndex > 0) {
            qIndex--;
            renderQuiz();
          }
        });

        document.getElementById("zfsNextQBtn").addEventListener("click", function () {
          if (isLast) {
            renderResult();
          } else {
            qIndex++;
            renderQuiz();
          }
        });
      }

      function renderResult() {
        var data = window.ZarifMufredatYardimci.getSinif(activeGrade);
        var questions = data.miniTest || [];
        var total = questions.length;
        var correctCount = 0;
        var letters = ["A", "B", "C", "D", "E"];

        var reviewHtml = questions.map(function (item, idx) {
          var chosen = answers[idx];
          var ok = chosen === item.dogru;
          if (ok) correctCount++;

          var stepsHtml = (item.cozumAdimlari || []).map(function (step, sIdx) {
            return '<div class="zfs-step-row" style="margin-top:6px;"><strong>Adım ' + (sIdx + 1) + ':</strong> ' + esc(step) + '</div>';
          }).join("");

          return (
            '<div class="zfs-review-item ' + (ok ? 'is-correct' : 'is-wrong') + '">' +
              '<div style="font-weight:800;margin-bottom:6px;">' +
                (ok ? '✅ Doğru' : '❌ Yanlış / Boş') + ' — Soru ' + (idx + 1) + ' (' + esc(item.konu) + ')' +
              '</div>' +
              '<div style="font-weight:600;color:#3B281E;margin-bottom:6px;">' + esc(item.soru) + '</div>' +
              '<div style="font-size:0.92rem;color:#6E5A4F;margin-bottom:8px;">' +
                'Senin cevabın: <strong>' + (chosen === null ? 'Boş' : letters[chosen] + ') ' + esc(item.siklar[chosen])) + '</strong>' +
                ' • Doğru cevap: <strong style="color:#1E7550;">' + letters[item.dogru] + ') ' + esc(item.siklar[item.dogru]) + '</strong>' +
              '</div>' +
              (!ok
                ? '<div style="margin-top:8px;"><span style="font-size:0.875rem;font-weight:800;color:#C85A17;">📌 Adım Adım Çözüm Basamakları:</span>' + stepsHtml + '</div>'
                : '<details style="margin-top:6px;"><summary style="cursor:pointer;font-size:0.9rem;font-weight:700;color:#1E7550;">Çözüm adımlarını incele</summary>' + stepsHtml + '</details>') +
            '</div>'
          );
        }).join("");

        var score = Math.round((correctCount / total) * 100);
        var wrongCount = total - correctCount;

        shellEl.innerHTML =
          '<div class="zfs-score-hero">' +
            '<span class="zfs-badge-free" style="margin-bottom:10px;">' + esc(data.baslik) + ' • Mini Kontrol Sonucu</span>' +
            '<div class="zfs-score-big">' + score + ' Puan</div>' +
            '<p style="margin:8px 0 0;font-size:1.05rem;font-weight:700;color:#3B281E;">' +
              correctCount + ' Doğru • ' + wrongCount + ' Yanlış / Boş (Toplam 5 Soru)' +
            '</p>' +
          '</div>' +
          '<h3 class="zfs-section-label">📋 Soru Bazlı Özet ve Adım Adım Çözümler</h3>' +
          reviewHtml +
          '<div class="zfs-convert-banner">' +
            '<h3>🚀 Tüm Kazanımlarda Tam Performansını Ölç</h3>' +
            '<p>20 soruluk tam kazanım testlerine, detaylı gelişim karnene ve yanlış soru tekrarına erişmek için ücretsiz üye ol.</p>' +
            '<div class="zfs-btn-row">' +
              '<a class="zfs-btn-emerald" href="kayit-giris.html?mode=register">Ücretsiz Üye Ol →</a>' +
              '<button type="button" class="zfs-btn-outline" id="zfsRetryQuizBtn">Testi Tekrar Çöz</button>' +
              '<a class="zfs-btn-outline" href="konu.html?sinif=' + encodeURIComponent(activeGrade) + '">Konu Stüdyosuna Dön</a>' +
            '</div>' +
          '</div>';

        document.getElementById("zfsRetryQuizBtn").addEventListener("click", function () {
          renderSetup();
        });
      }

      gradeButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          activeGrade = btn.dataset.grade;
          renderSetup();
        });
      });

      renderSetup();
    })();
  </script>
  <script src="/assets/site-footer.js?v=2"></script>
  <script src="/assets/page-transitions.js?v=1" defer></script>
</body>
</html>
